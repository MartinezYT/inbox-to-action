name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Eval (offline rules baseline)
        run: python -m evals.run_eval --min-accuracy 0.8
        env:
          TRIAGE_MODE: rules
      - name: Build Docker image
        run: docker build -t inbox-to-action .
