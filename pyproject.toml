[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()/Header() in defaults is the intended pattern

[tool.ruff.lint.per-file-ignores]
"app/dashboard.py" = ["E501"]  # embedded HTML/JS

[tool.pytest.ini_options]
testpaths = ["tests"]
